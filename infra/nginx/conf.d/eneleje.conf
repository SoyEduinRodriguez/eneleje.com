# =============================================================================
# eneleje.com · Nginx reverse proxy
# Mapeo: Host -> X-Forwarded-Host / X-Subdomain (el middleware TS hace el resto)
# TLS: certificado wildcard (Cloudflare Origin CA o Let's Encrypt DNS-01)
#      montar ./nginx/certs/fullchain.pem + privkey.pem
# =============================================================================

upstream eneleje_app {
    server app:3000;
    keepalive 32;
}

# --- Rate limiting por zona ---------------------------------------------------
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;    # navegación
limit_req_zone $binary_remote_addr zone=api:10m     rate=10r/s;    # APIs
limit_req_zone $binary_remote_addr zone=auth:10m    rate=3r/m;     # login/registro
limit_req_zone $binary_remote_addr zone=track:10m   rate=60r/m;    # /api/track
limit_conn_zone $binary_remote_addr zone=connperip:10m;

# --- Subdominio extraído del Host (logs y header hacia la app) ----------------
map $host $subdomain {
    ~^(?<s>[^.]+)\.eneleje\.com$  $s;
    default                        "";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Real IP detrás de Cloudflare (descomentar si la zona está proxied) -------
# include /etc/nginx/snippets/cloudflare-realip.conf;

server {
    listen 80;
    listen [::]:80;
    server_name eneleje.com www.eneleje.com *.eneleje.com localhost;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eneleje.com www.eneleje.com *.eneleje.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Límite de cuerpo: uploads van directo a R2 con URL presignada;
    # aquí solo pasan formularios y fotos pequeñas (logo).
    client_max_body_size 12m;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    limit_conn connperip 20;
    limit_req zone=general burst=60 nodelay;

    # Assets inmutables de Next.js: cacheado 1 año (hash en el nombre)
    location /_next/static/ {
        limit_req zone=general burst=120 nodelay;
        proxy_pass http://eneleje_app;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Analytics fire-and-forget: zona propia para que un cliente abusivo
    # no consuma la zona general.
    location /api/track {
        limit_req zone=track burst=30 nodelay;
        proxy_pass http://eneleje_app;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Autenticación: zona estricta (fuerza bruta)
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://eneleje_app;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://eneleje_app;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Todo lo demás: la app Next.js resuelve subdominio/ciudad/negocio
    location / {
        proxy_pass http://eneleje_app;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 60s;
    }
}

# --- Seguridad extra (opcional, después de validar la carga) ------------------
# CSP restrictiva compatible con Next + MapLibre + R2:
#   add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://media.eneleje.com https://*.tile.openstreetmap.org;
#     style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com;
#     frame-src https://challenges.cloudflare.com; connect-src 'self' https://*.tile.openstreetmap.org https://*.tiles.mapbox.com" always;
