# Headers de seguridad compartidos (include desde server/location)
# NOTA nginx: si un location define su propio add_header, debe re-incluir este
# snippet o perderá estos headers (comportamiento de herencia de nginx).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
add_header X-DNS-Prefetch-Control "on" always;
